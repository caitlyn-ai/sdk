[package]
name = "caitlyn-sdk-core"
description = "The runtime behind the generated Caitlyn Rust SDK (caitlyn-sdk): the Caitlyn wire protocol, sign-in, retries, streams and telemetry."
readme = "README.md"
keywords = ["caitlyn", "sdk", "api"]
categories = ["api-bindings", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["rustls-ring"]
# TLS through rustls with the ring provider: no OpenSSL, no C toolchain beyond ring's own.
rustls-ring = ["dep:rustls"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1.40", features = ["time", "sync", "macros", "rt"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
