# Stages @caitlyn-ai/sdk-core and @caitlyn-ai/sdk on npm with provenance (npm trusted publishing), for a maintainer
# to approve on npmjs.com with two-factor authentication. The trusted publishers allow `npm stage publish` only;
# direct `npm publish` is off (https://docs.npmjs.com/staged-publishing).
#
# Runs on the GitHub mirror of custom-d/caitlyn/sdk (github.com/caitlyn-ai/sdk), never on GitLab: npm trusted publishing accepts OpenID
# Connect tokens from GitHub Actions (and GitLab.com), not from git.customd.com. The mirror receives main and the
# release tags from GitLab; nobody commits to it. Setting up the mirror, the npm trusted publishers and the
# `npm` environment is described in CONTRIBUTING.md, "Releasing to npm".
#
# A tag v<version> stages that version, which must match both packages' package.json. The job runs in the `npm`
# environment because the trusted publishers are bound to that name; it has no required reviewer, since the one
# approval is on npmjs.com.
name: release-npm

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write # the OpenID Connect token npm exchanges for a short-lived publish credential
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Staged publishing needs npm 11.15.0 or later (trusted publishing alone needs 11.5.1).
      - run: npm install -g npm@11.21.1
      - name: Check the tag matches VERSION and both packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(cat ../VERSION)" = "$version" ] || { echo "VERSION is $(cat ../VERSION), the tag is $GITHUB_REF_NAME" >&2; exit 1; }
          for p in packages/sdk-core packages/sdk; do
            actual="$(node -p "require('./$p/package.json').version")"
            [ "$actual" = "$version" ] || { echo "$p is $actual, the tag is $GITHUB_REF_NAME" >&2; exit 1; }
          done
      - name: Test, build and check the packages
        run: ../scripts/test-typescript.sh
      # sdk-core first: the SDK depends on that exact version.
      - name: Stage @caitlyn-ai/sdk-core
        run: npm stage publish --provenance --access public
        working-directory: typescript/packages/sdk-core
      - name: Stage @caitlyn-ai/sdk
        run: npm stage publish --provenance --access public
        working-directory: typescript/packages/sdk
