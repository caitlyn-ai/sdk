# Stages @caitlyn-ai/sdk-core and @caitlyn-ai/sdk on npm with provenance (npm trusted publishing), for a maintainer
# to approve on npmjs.com with two-factor authentication. The trusted publishers allow `npm stage publish` only;
# direct `npm publish` is off (https://docs.npmjs.com/staged-publishing).
#
# Runs on the GitHub mirror of custom-d/caitlyn/sdk (github.com/caitlyn-ai/sdk), never on GitLab: npm trusted publishing accepts OpenID
# Connect tokens from GitHub Actions (and GitLab.com), not from git.customd.com. The mirror receives main and the
# release tags from GitLab; nobody commits to it. Setting up the mirror, the npm trusted publishers and the
# `npm` environment is described in CONTRIBUTING.md, "Releasing".
#
# semantic-release on GitLab's main commits the version into every SDK file that carries it (chore(release): x.y.z)
# and tags that commit v<version> (.releaserc.yml); nobody tags by hand. This job checks that the tag's files name its
# version (scripts/version.mjs check), then tests, builds and stages that version.
# The job runs in the `npm` environment because the trusted publishers are bound to that name; it has no required
# reviewer, since the one approval is on npmjs.com.
name: release-npm

# A beta tag (v<version>-beta.<n>, made by the GitLab model:main job) does not start it: npm betas are a
# maintainer's choice, made by running this workflow by hand with that tag (CONTRIBUTING.md, "Betas"). A beta
# goes to npm's `beta` dist-tag, so `latest` stays the last stable release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release or beta tag to stage, such as v0.12.0-beta.3'
        required: true

permissions:
  contents: read

jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    environment: npm
    permissions:
      contents: read
      id-token: write # the OpenID Connect token npm exchanges for a short-lived publish credential
    defaults:
      run:
        working-directory: typescript
    steps:
      # v7 of both run on Node 24 (v4 ran on the deprecated Node 20).
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # A release builds from a clean install, never from a dependency cache. (setup-node caches by itself when
          # package.json names a packageManager.)
          package-manager-cache: false
      # Staged publishing needs npm 11.15.0 or later (trusted publishing alone needs 11.5.1).
      - run: npm install -g npm@11.21.1
      # The tag is on the release commit, which already carries its version in every stamped file (the packages, the
      # lock files, the User-Agent and tracer version). This is the check that decides a release: fail unless every
      # one of them names the tag's version. Nothing is stamped here.
      - name: Check the tag's files carry its version
        run: node ../scripts/version.mjs check "${TAG#v}"
      - name: Check both packages carry the tag's version
        run: |
          version="${TAG#v}"
          for p in packages/sdk-core packages/sdk; do
            actual="$(node -p "require('./$p/package.json').version")"
            [ "$actual" = "$version" ] || { echo "$p is $actual, the tag is $TAG" >&2; exit 1; }
          done
      - name: Test, build and check the packages
        run: ../scripts/test-typescript.sh
      # sdk-core first: the SDK depends on that exact version.
      - name: Stage @caitlyn-ai/sdk-core
        run: npm stage publish --provenance --access public --tag "$(case "$TAG" in *-*) echo beta;; *) echo latest;; esac)"
        working-directory: typescript/packages/sdk-core
      - name: Stage @caitlyn-ai/sdk
        run: npm stage publish --provenance --access public --tag "$(case "$TAG" in *-*) echo beta;; *) echo latest;; esac)"
        working-directory: typescript/packages/sdk
