# The Rust examples the developer docs show: hand-written (src/) and generated from the model's @examples
# (examples/, by scripts/docs-snippets.mjs). scripts/test-rust.sh runs clippy over every target.
[package]
name = "caitlyn-examples"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
caitlyn-sdk = { path = "../../rust/caitlyn-sdk" }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
