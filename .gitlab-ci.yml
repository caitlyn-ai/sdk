# The Caitlyn SDK repository's pipeline (custom-d/caitlyn/sdk).
#
#   toolchain              Builds docker/Dockerfile into this project's registry when it changes. Every other job
#                          runs in that image, the same one `make` uses locally.
#   generate               Regenerates every SDK from the committed model snapshot and fails if the committed
#                          generated code differs: generated code is reviewed in merge requests, never edited.
#   typescript/python/go/rust  Install, strict type checks, lint, and the conformance harness against the mock server.
#   typescript:browser     The TypeScript conformance harness against the browser build, in headless Chromium,
#                          Firefox and WebKit (Playwright's image), from a page on another origin than the mock server.
#   conformance            Checks that every language ran and passed every protocol and example case.
#   model:version-check    Is the snapshot the latest published model? A warning on merge requests when not.
#   model:snapshot-only    Merge requests: fails when model/ changes without model/model.lock.json, that is, when the
#                          snapshot was edited here instead of pulled from the app's smithy/ (CONTRIBUTING.md).
#   docs:*                 Developer docs build, merge request previews, publishing to build.caitlyn.ai and to
#                          the ask.caitlyn.ai knowledge base. Off until DOCS_ENABLED is "true" (docs/README.md).
#   fetch-semantic-version On main: the version the next release would have (VERSION.txt), from the shared
#                          semantic-versioning template.
#   release                On main, after conformance passes: semantic-release (.releaserc.yml) tags vX.Y.Z, tags
#                          the same commit go/vX.Y.Z for the Go module, and creates the GitLab release when the
#                          commits since the last tag call for one. The push mirror takes the tags to GitHub, which
#                          stages the npm packages and publishes to PyPI and crates.io (CONTRIBUTING.md, "Releasing").
#   release:go             By hand, from a pipeline run on main with GO_TAG=vX.Y.Z: tags a release for Go when the
#                          release job's Go tag failed.
#   release:*              A placeholder for the Homebrew release, and pointers to the GitHub workflows for npm, PyPI
#                          and crates.io. Off until RELEASES_ENABLED is "true".
#   model:main             Triggered by a merge to the app's main that changes its model: builds that model, regenerates
#                          every SDK, and only once all four conformance suites pass commits it to main with a beta tag
#                          (scripts/model-main.sh); the tag publishes the Python, Rust and Go betas.
#
# CI variables this file reads (set on the project, never in this file):
#   DOCS_ENABLED, DOCS_PUBLISH_ROLE_ARN (protected), DOCS_PREVIEW_ROLE_ARN, DOCS_DISTRIBUTION_ID (protected),
#   ASK_CAITLYN_CLIENT_ID and ASK_CAITLYN_CLIENT_SECRET (masked, protected),
#   GITLAB_TOKEN (masked, protected: a project access token with the Maintainer role, which may create the
#   protected v* and go/v* tags, and the api and write_repository scopes; semantic-release, scripts/go-tag.mjs and
#   release:go and model:main use it), RELEASES_ENABLED, GO_TAG (release:go only).

include:
  # fetch-semantic-version and release: semantic-release in the shared image, as the app repository runs it.
  - project: 'custom-d/devops-platform/ci-templates/semantic-versioning'
    file: 'semver.gitlab-ci.yml'

workflow:
  rules:
    # The release commit (chore(release): x.y.z, which the release job pushes to main) runs no branch pipeline: it
    # only stamps the version, and its tag's pipeline (below) checks that. Its message has no [skip ci], because
    # GitHub Actions would then skip the tag's release-npm run (CONTRIBUTING.md, "Releasing").
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): /'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline" # triggered by an app merge to main (model:main)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api" # a pipeline started through the API, such as examples:live (below)
    # A go/v* tag (made with each release for the Go module, scripts/go-tag.mjs) runs nothing: it is on the release
    # commit, which its v* tag's pipeline checks.
    - if: $CI_COMMIT_TAG =~ /^go\//
      when: never
    # A v* tag (made by the release job) runs release:version, and the tag-driven release:* placeholders once
    # RELEASES_ENABLED is "true". Nothing else: npm, PyPI and crates.io release from the tag on the GitHub mirror.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - toolchain
  - generate
  - test
  - conformance
  - docs
  - release

variables:
  # Bump when docker/Dockerfile or scripts/install-smithy-cli.sh changes; the toolchain job pushes this tag.
  TOOLCHAIN_VERSION: '2'
  TOOLCHAIN_IMAGE: '$CI_REGISTRY_IMAGE/toolchain:$TOOLCHAIN_VERSION'
  # The app project's package registry, where each app release publishes caitlyn-v3-model/<version>/.
  MODEL_PROJECT_ID: '653'
  MODEL_PACKAGE: 'caitlyn-v3-model'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.cache/gradle'
  GOMODCACHE: '$CI_PROJECT_DIR/.cache/go-mod'
  GOCACHE: '$CI_PROJECT_DIR/.cache/go-build'
  npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
  UV_CACHE_DIR: '$CI_PROJECT_DIR/.cache/uv'
  CARGO_HOME: '$CI_PROJECT_DIR/.cache/cargo'

.toolchain:
  image: $TOOLCHAIN_IMAGE
  needs:
    - job: toolchain
      optional: true
  interruptible: true
  cache:
    key: 'toolchain-$TOOLCHAIN_VERSION'
    paths:
      - .cache/

.mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- toolchain

toolchain:
  stage: toolchain
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile" --destination "$TOOLCHAIN_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/Dockerfile
        - scripts/install-smithy-cli.sh
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------- generate and test

generate:
  extends: .toolchain
  stage: generate
  script:
    - scripts/generate.sh
    - |
      # The generated code, and the hand-written files scripts/version.mjs stamps with the version in VERSION.
      if ! git diff --exit-code --stat -- typescript/packages/sdk python/caitlyn go rust/caitlyn-sdk conformance/cases \
          typescript/packages/sdk-core typescript/package-lock.json python/caitlyn-core python/uv.lock rust/Cargo.toml \
          rust/Cargo.lock conformance/rust/Cargo.lock examples/rust/Cargo.lock codegen/smithy-build.json; then
        echo "The committed generated code differs from a fresh generation. Run make generate and commit the result."
        exit 1
      fi
  rules: !reference [.mr-and-main, rules]

typescript:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-typescript.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/typescript.xml, build/conformance/typescript-browser-build.xml, build/conformance/typescript-runtime.xml, build/package/report.json]
    reports:
      junit: [build/conformance/typescript.xml, build/conformance/typescript-browser-build.xml, build/conformance/typescript-runtime.xml]
  rules: !reference [.mr-and-main, rules]

# The browser build in real browsers. Custom D's Playwright image (custom-d/devops-platform/container-images/playwright,
# Microsoft's image served from our registry) carries the browsers for one Playwright version: keep the version in its
# name (playwright-1.64.1) the same as the playwright version in typescript/package.json.
typescript:browser:
  stage: test
  image: containers.customd.com/custom-d/devops-platform/container-images/playwright/playwright-1.64.1:latest
  interruptible: true
  needs: []
  cache:
    key: 'playwright-npm'
    paths:
      - .cache/npm/
  script:
    - cd typescript
    - npm ci --no-audit --no-fund --silent
    - npm run -s conformance:browser
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/typescript-browser-*.xml]
    reports:
      junit: build/conformance/typescript-browser-*.xml
  rules: !reference [.mr-and-main, rules]

python:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-python.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/python.xml]
    reports:
      junit: build/conformance/python.xml
  rules: !reference [.mr-and-main, rules]

go:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-go.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/go.json]
  rules: !reference [.mr-and-main, rules]

rust:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-rust.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/rust.json]
  rules: !reference [.mr-and-main, rules]

conformance:
  extends: .toolchain
  stage: conformance
  needs: [typescript, 'typescript:browser', python, go, rust]
  script:
    - node scripts/check-conformance.mjs
  rules: !reference [.mr-and-main, rules]

# ---------------------------------------------------------------------------- the model

# Runs every SDK's developer docs examples against a real workspace (make examples-live, CONTRIBUTING.md). Manual:
# it needs a deployed server. The workspace and agent default to the review environment of the app's v3 server and
# can be overridden per pipeline; the token is the masked variable CAITLYN_TOKEN_MR2062, never echoed (the runner
# masks it in what the examples print). The results table is in the job log.
examples:live:
  extends: .toolchain
  stage: test
  needs: []
  # One run at a time: every run changes the same agents' drafts and versions.
  resource_group: examples-live
  # Each language waits up to 15 to 21 minutes for a document to index, then deletes what it made; the project's
  # one-hour default would stop the job part way, before the last languages' clean-up.
  timeout: 2h
  variables:
    CAITLYN_WORKSPACE: caitlyn.mr-2062.labs.customd.com
    CAITLYN_AGENT_ID: 988D468D
    # Set for a pipeline when the workspace has them: a knowledge base the document checks may add to, an agent the
    # publish check may publish, and CAITLYN_PUBLIC_ROLE_ONLY=1 while the workspace's role setup has not run.
    CAITLYN_KNOWLEDGE_BASE_ID: ''
    CAITLYN_PUBLISH_AGENT_ID: ''
    CAITLYN_PUBLIC_ROLE_ONLY: ''
  script:
    - CAITLYN_TOKEN="$CAITLYN_TOKEN_MR2062" node scripts/examples-live.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

model:snapshot-only:
  extends: .toolchain
  stage: generate
  script:
    - scripts/model-snapshot-check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# A merge request's title is the squash commit's message, and a releasing one (feat, fix, perf, revert, or !) becomes
# a line of CHANGELOG.md, which build.caitlyn.ai publishes as its Changelog. This runs the docs' public-wording rules
# over it (scripts/docs-mr-title.mjs), so a title that would publish something internal fails while it can still be
# edited. GitLab does not start a pipeline when only the title changes: rerun this job after editing it.
docs:mr-title:
  extends: .toolchain
  stage: generate
  script:
    - node scripts/docs-mr-title.mjs "$CI_MERGE_REQUEST_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

model:version-check:
  extends: .toolchain
  stage: generate
  # Inherits needs from .toolchain, so it waits for a rebuilt toolchain image instead of pulling a tag that
  # doesn't exist yet.
  script:
    - scripts/model-check.sh
  # Exit 2 means "behind, or an unpublished snapshot": a warning, not a failure. Nothing published yet passes.
  allow_failure:
    exit_codes: [2]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Triggered by the app's main pipeline after a merge that changes smithy/, with APP_COMMIT (CONTRIBUTING.md, "How a
# model change reaches the SDK"). Commits straight to main, and tags a beta, only once every suite passes. One at a
# time, and never cancelled part way through a push.
model:main:
  extends: .toolchain
  stage: generate
  needs: []
  interruptible: false
  resource_group: model-main
  variables:
    GIT_DEPTH: '0'
  script:
    - scripts/model-main.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $APP_COMMIT
    - if: $CI_PIPELINE_SOURCE == "web" && $APP_COMMIT

# ---------------------------------------------------------------------------- developer docs

docs:build:
  extends: .toolchain
  stage: docs
  needs: []
  variables:
    # The whole history, so each page's sitemap lastmod is its source's newest commit (scripts/docs-sitemap.mjs); a
    # shallow clone would date every older page at the clone's oldest commit
    GIT_DEPTH: '0'
  script:
    - scripts/docs-build.sh
  artifacts:
    expire_in: 1 week
    paths: [build/docs/]
  rules:
    # Only the default branch's build is the live one (DOCS_LIVE): it alone publishes sitemap.xml and names it in
    # robots.txt, and its pages alone are indexed. A preview publishes no sitemap and every page carries noindex.
    # The live build shows "Was this page useful?" and sends answers to /_feedback (production-demo-infrastructure,
    # developer-docs/feedback.tf). Previews show it, so a reviewer sees the page as it ships, but send nothing: they
    # have no endpoint (their hosting has no /_feedback), and the panel says the answer was not sent.
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
        PUBLIC_DOCS_FEEDBACK_ENDPOINT: /_feedback
        DOCS_LIVE: 'on'
    # A release's v* tag builds the live site again: the release commit's CHANGELOG.md has the new release, so the
    # Changelog, its feed and the install instructions show it when it ships, not with the next merge to main (the
    # release commit's own branch pipeline does not run)
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d/
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
        PUBLIC_DOCS_FEEDBACK_ENDPOINT: /_feedback
        DOCS_LIVE: 'on'

.docs-aws:
  stage: docs
  image:
    name: amazon/aws-cli:2.27.50
    entrypoint: ['']
  needs: [docs:build]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.customd.com
  before_script:
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN"
      --role-session-name "gitlab-$CI_PIPELINE_ID" --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))

docs:preview:
  extends: .docs-aws
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.preview.build.caitlyn.ai/
    on_stop: docs:preview:stop
    auto_stop_in: 30 days
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"

docs:preview:stop:
  extends: .docs-aws
  needs: []
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
    GIT_STRATEGY: none
  script:
    - aws s3 rm --recursive "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID/"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

docs:publish:
  extends: .docs-aws
  variables:
    ROLE_ARN: $DOCS_PUBLISH_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site s3://cd-caitlyn-developer-docs
    - aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths '/*'
  environment:
    name: docs/production
    url: https://build.caitlyn.ai/
  resource_group: docs-production
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d/

# Publishes the built pages into the ask.caitlyn.ai developer-docs knowledge base. A dry run until the publisher
# is built on @caitlyn-ai/sdk (scripts/docs-kb-publish.mjs explains what it waits for).
docs:knowledge-base:
  extends: .toolchain
  stage: docs
  needs: [docs:build, docs:publish]
  script:
    - node scripts/docs-kb-publish.mjs --dry-run
  resource_group: docs-knowledge-base
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- releases

# The template's jobs (custom-d/devops-platform/ci-templates/semantic-versioning), with stamp-version between them,
# as the app's update-package-version job is. On main, after conformance passes:
#   fetch-semantic-version  the dry run: VERSION.txt, the version the next release would have (none when no release
#                           is due)
#   stamp-version           writes that version into VERSION and every file that carries it (scripts/version.mjs
#                           release), as artifacts
#   release                 semantic-release: checks the stamp, commits it to main as chore(release): x.y.z, tags
#                           that commit vX.Y.Z and creates the GitLab release (.releaserc.yml)
# The release commit is chore, which never releases, and the workflow rules run no main pipeline for it.
#
# Both run on main only. The template's rules also accept other branch patterns, and they match a tag pipeline too
# ($CI_COMMIT_BRANCH and the unset $CI_TESTING_BRANCH are both empty there), where `conformance` does not exist and
# the pipeline could not be created. These rules replace the template's.
fetch-semantic-version:
  needs: []
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# The artifact paths are every stamped file; scripts/version.mjs assets (in make generate) keeps this list complete.
stamp-version:
  extends: .toolchain
  stage: conformance
  needs:
    - job: fetch-semantic-version
      artifacts: true
  script:
    - |
      if [ ! -s VERSION.txt ]; then
        echo "No release is due: nothing to stamp."
        exit 0
      fi
      node scripts/version.mjs release "$(cat VERSION.txt)"
  artifacts:
    paths:
      - VERSION # stamped
      - typescript/packages/sdk-core/package.json # stamped
      - typescript/packages/sdk-core/src/telemetry.ts # stamped
      - typescript/package-lock.json # stamped
      - python/caitlyn-core/pyproject.toml # stamped
      - python/caitlyn-core/src/caitlyn_core/__init__.py # stamped
      - python/uv.lock # stamped
      - rust/Cargo.toml # stamped
      - rust/Cargo.lock # stamped
      - conformance/rust/Cargo.lock # stamped
      - examples/rust/Cargo.lock # stamped
      - codegen/smithy-build.json # stamped
      - typescript/packages/sdk/package.json # stamped
      - typescript/packages/sdk/src/runtimeConfig.shared.ts # stamped
      - python/caitlyn/pyproject.toml # stamped
      - python/caitlyn/caitlyn/_version.py # stamped
      - go/version.go # stamped
      - rust/caitlyn-sdk/Cargo.toml # stamped
      - rust/caitlyn-sdk/src/lib.rs # stamped
  rules:
    - !reference [fetch-semantic-version, rules]

release:
  # `needs` replaces the template's stage ordering, under which release ran only after every earlier job had
  # passed, so each one it depends on is named: a failed job in `needs` (none allows failure) skips the release.
  # stamp-version's artifacts are the stamped files the release commit carries. The dry run is required now, so
  # SEMVER_TEST_DISABLED turns the release off too.
  needs:
    - job: conformance
    - job: fetch-semantic-version
    - job: stamp-version
      artifacts: true
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED || $CI_DEPLOY_FREEZE
      when: never
    # A stable release is a person's decision: run it by hand from a main pipeline. Betas are automatic (model:main).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# On the tag the release job made: the tag's tree must already carry its version in every stamped file (the release
# commit). GitHub's release-npm checks the same before it stages anything.
release:version:
  extends: .toolchain
  stage: release
  needs: []
  script:
    - node scripts/version.mjs check "${CI_COMMIT_TAG#v}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

# ---------------------------------------------------------------------------- package releases

# Placeholders. npm, PyPI and crates.io releases run on the GitHub mirror, and Go is a tag (below). The Homebrew
# tap can only be claimed by a first publish, which is still to be set up: Sigstore signatures, software bills of
# materials and provenance come with it.
.release-placeholder:
  stage: release
  image: alpine:3.22
  needs: []
  script:
    - echo "$RELEASE_WHAT is not built yet." && exit 1
  rules:
    - if: $RELEASES_ENABLED == "true" && $CI_COMMIT_TAG
      when: manual

# npm releases run on the GitHub mirror, not here: npm trusted publishing (with provenance) accepts OpenID
# Connect tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-npm.yml and
# CONTRIBUTING.md, "Releasing". This placeholder says so if someone runs it.
release:npm:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'npm publishing here (it runs on the GitHub mirror: .github/workflows/release-npm.yml)'

# PyPI releases run on the GitHub mirror, not here: PyPI trusted publishing (with attestations) accepts OpenID
# Connect tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-pypi.yml and
# CONTRIBUTING.md, "Releasing". This placeholder says so if someone runs it.
release:pypi:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'PyPI publishing here (it runs on the GitHub mirror: .github/workflows/release-pypi.yml)'

# Go needs no publishing: the module github.com/caitlyn-ai/sdk/go is go/ in the GitHub mirror, and a release is the
# tag go/vX.Y.Z on the release commit, which semantic-release creates with vX.Y.Z (.releaserc.yml,
# scripts/go-tag.mjs). The Go module proxy fetches the module from GitHub the first time someone asks for it.
# This job tags a release by hand, when its Go tag failed: run a pipeline on main (Build → Pipelines → Run pipeline)
# with the variable GO_TAG set to the release tag, such as v0.9.0, then start this job. A Go tag already on that
# release's commit is left alone. It refuses a release whose go/go.mod declares another module path: every release up
# to v0.8.0 declares github.com/caitlyn-ai/caitlyn-go, so they have no Go release.
release:go:
  extends: .toolchain
  stage: release
  needs: []
  script:
    - node scripts/go-tag.mjs "$GO_TAG"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GO_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual

# crates.io releases run on the GitHub mirror, not here: crates.io trusted publishing accepts OpenID Connect
# tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-crates.yml and CONTRIBUTING.md,
# "Releasing". This placeholder says so if someone runs it.
release:crates:
