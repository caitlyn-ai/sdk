# The Caitlyn SDK repository's pipeline (custom-d/caitlyn/sdk).
#
#   toolchain              Builds docker/Dockerfile into this project's registry when it changes. Every other job
#                          runs in that image, the same one `make` uses locally.
#   generate               Regenerates every SDK from the committed model snapshot and fails if the committed
#                          generated code differs: generated code is reviewed in merge requests, never edited.
#   typescript/python/go/rust  Install, strict type checks, lint, and the conformance harness against the mock server.
#   typescript:browser     The TypeScript conformance harness against the browser build, in headless Chromium,
#                          Firefox and WebKit (Playwright's image), from a page on another origin than the mock server.
#   conformance            Checks that every language ran and passed every protocol and example case.
#   model:version-check    Is the snapshot the latest published model? A warning on merge requests when not.
#   model:snapshot-only    Merge requests: fails when model/ changes without model/model.lock.json, that is, when the
#                          snapshot was edited here instead of pulled from the app's smithy/ (CONTRIBUTING.md).
#   changes:check          Merge requests: a releasing title comes with a change file (changes/*.md) that reads well,
#                          and the file, the title's `!` and the model's breaking changes agree (CONTRIBUTING.md,
#                          "Release notes").
#   docs:*                 Developer docs build, merge request previews, publishing to build.caitlyn.ai and to
#                          the ask.caitlyn.ai knowledge base. Off until DOCS_ENABLED is "true" (docs/README.md).
#   fetch-semantic-version On main: the version the next release would have (VERSION.txt), from the shared
#                          semantic-versioning template.
#   release                On main, after conformance passes: semantic-release (.releaserc.yml) tags vX.Y.Z, tags
#                          the same commit go/vX.Y.Z for the Go module, and creates the GitLab release when the
#                          commits since the last tag call for one. The push mirror takes the tags to GitHub, which
#                          stages the npm packages and publishes to PyPI and crates.io (CONTRIBUTING.md, "Releasing").
#   release:go             By hand, from a pipeline run on main with GO_TAG=vX.Y.Z: tags a release for Go when the
#                          release job's Go tag failed.
#   release:*              A placeholder for the Homebrew release, and pointers to the GitHub workflows for npm, PyPI
#                          and crates.io. Off until RELEASES_ENABLED is "true".
#   cli:vet, cli:test      The CLI (cli/): gofmt, go vet and staticcheck; the tests under the race detector.
#   cli:snapshot           Every pipeline: a GoReleaser snapshot build of every archive and package (no signing, no
#                          image, nothing published), so a release can't be the first time the configuration runs.
#   cli:release, cli:publish, cli:packages  By hand, on a protected release tag, once RELEASES_ENABLED is "true":
#                          build, sign and lay out the release, upload it to s3://cd-caitlyn-cli-releases and move the
#                          channel pointers (cli/scripts/release-publish.sh), and only then push the Homebrew formula
#                          and the Scoop manifest that point at it (cli/scripts/release-packages.sh).
#   model:main             Triggered by a merge to the app's main that changes its model: builds that model, regenerates
#                          every SDK, and only once all four conformance suites pass commits it to main with a beta tag
#                          (scripts/model-main.sh); the tag publishes the Python, Rust and Go betas.
#
# CI variables this file reads (set on the project, never in this file):
#   DOCS_ENABLED, DOCS_PUBLISH_ROLE_ARN (protected), DOCS_PREVIEW_ROLE_ARN, DOCS_DISTRIBUTION_ID (protected),
#   ASK_CAITLYN_CLIENT_ID and ASK_CAITLYN_CLIENT_SECRET (masked, protected),
#   GITLAB_TOKEN (masked, protected: a project access token with the Maintainer role, which may create the
#   protected v* and go/v* tags, and the api and write_repository scopes; semantic-release, scripts/go-tag.mjs and
#   release:go and model:main use it), RELEASES_ENABLED, GO_TAG (release:go only),
#   for the CLI's release (protected, so only protected v* tags see them): CLI_RELEASE_ROLE_ARN,
#   CLI_MINISIGN_SECRET_ID, CLI_DISTRIBUTION_ID, CAITLYN_MINISIGN_PUBLIC_KEY, CLI_SIGNING_ROLE_ARN (the role that may
#   sign with the KMS release key) and CAITLYN_COSIGN_PUBLIC_KEY (that key's public half, one line of base64 DER), CAITLYN_TELEMETRY_ENDPOINT (an override
#   only: release builds send usage data to https://telemetry.caitlyn.ai/cli by default) and CLI_TELEMETRY_OFF (1 builds
#   with no usage-data endpoint), HOMEBREW_TAP_TOKEN and SCOOP_BUCKET_TOKEN (masked), and GHCR_USERNAME and GHCR_TOKEN
#   (masked) for ghcr.io/caitlyn-ai/caitlyn.

include:
  # fetch-semantic-version and release: semantic-release in the shared image, as the app repository runs it.
  - project: 'custom-d/devops-platform/ci-templates/semantic-versioning'
    file: 'semver.gitlab-ci.yml'

workflow:
  rules:
    # The release commit (chore(release): x.y.z, which the release job pushes to main) runs no branch pipeline: it
    # only stamps the version, and its tag's pipeline (below) checks that. Its message has no [skip ci], because
    # GitHub Actions would then skip the tag's release-npm run (CONTRIBUTING.md, "Releasing").
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): /'
      when: never
    # A merge request that changes the toolchain image builds its own tag and uses it throughout its pipeline, so
    # main and every other merge request keep the image they had until it merges (the toolchain job, below)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/Dockerfile
        - scripts/install-smithy-cli.sh
      variables:
        TOOLCHAIN_TAG: '$TOOLCHAIN_VERSION-mr$CI_MERGE_REQUEST_IID'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline" # triggered by an app merge to main (model:main)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api" # a pipeline started through the API, such as examples:live (below)
    # A go/v* tag (made with each release for the Go module, scripts/go-tag.mjs) runs nothing: it is on the release
    # commit, which its v* tag's pipeline checks.
    - if: $CI_COMMIT_TAG =~ /^go\//
      when: never
    # A v* tag (made by the release job) runs release:version, and the tag-driven release:* placeholders once
    # RELEASES_ENABLED is "true". Nothing else: npm, PyPI and crates.io release from the tag on the GitHub mirror.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - toolchain
  - generate
  - test
  - conformance
  - docs
  - release

variables:
  # Bump when docker/Dockerfile or scripts/install-smithy-cli.sh changes; the toolchain job pushes this tag on main.
  TOOLCHAIN_VERSION: '3'
  # The image's tag: TOOLCHAIN_VERSION, or a merge request's own (<version>-mr<iid>) when it changes the image
  # (the workflow rules, above)
  TOOLCHAIN_TAG: '$TOOLCHAIN_VERSION'
  TOOLCHAIN_IMAGE: '$CI_REGISTRY_IMAGE/toolchain:$TOOLCHAIN_TAG'
  # The app project's package registry, where each app release publishes caitlyn-v3-model/<version>/.
  MODEL_PROJECT_ID: '653'
  MODEL_PACKAGE: 'caitlyn-v3-model'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.cache/gradle'
  GOMODCACHE: '$CI_PROJECT_DIR/.cache/go-mod'
  GOCACHE: '$CI_PROJECT_DIR/.cache/go-build'
  npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
  UV_CACHE_DIR: '$CI_PROJECT_DIR/.cache/uv'
  CARGO_HOME: '$CI_PROJECT_DIR/.cache/cargo'
  # Every job's CPU and memory request on the Kubernetes runner, which sets none by default. Without requests the
  # scheduler packs a whole pipeline onto one node, where the jobs take three to four times as long and the
  # timing-sensitive conformance cases flake. This is the light tier, for the checks and release jobs; the busier jobs
  # extend .resources-medium or .resources-heavy (below). The memory includes the helper container's 300 to 450 MB
  # while it unpacks the cache (.cache/, about 68,000 files): the runner allows no helper request override, so the
  # build container's request carries it. No limits: a CPU limit throttles, which slows the timing-sensitive tests,
  # and the runner allows no limit override anyway. The runner caps requests at 8 CPU and 8Gi.
  KUBERNETES_CPU_REQUEST: '500m'
  KUBERNETES_MEMORY_REQUEST: '1Gi'
  # And its disk, which the runner also leaves unrequested. A pod with no ephemeral-storage request is the first the
  # kubelet evicts when its node runs low on disk ("The node was low on resource: ephemeral-storage"), and the
  # scheduler places it with no regard for disk. A job with the toolchain cache asks for more (.toolchain, below).
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '1Gi'
  # The architecture a job runs on, for the caches that hold compiled output (.caches, below); a tier on another
  # runner sets its own
  CACHE_ARCH: 'amd64'

.toolchain:
  image: $TOOLCHAIN_IMAGE
  needs:
    - job: toolchain
      optional: true
  interruptible: true
  # A job that builds asks for the most disk the shared runner allows (ephemeral_storage_request_overwrite_max_allowed,
  # in cd-hosting-cluster-management's applications/gitlab-runner): its caches and build output reached 7.7 GB
  # (rust) when every job restored all of them (pipeline 160279). No limit: a job past its request is evicted only when
  # its node runs low, and after every pod that asked for nothing. A check that builds nothing extends .light instead.
  variables:
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '8Gi'

# One cache per tool, so a job restores only what it uses: a job lists its caches (at most four) with
# !reference [.caches, <name>]. They were one 6.5 GB cache, which every toolchain job restored (about 50 seconds) and
# saved. A job that saves a cache saves what it restored plus what it added, so jobs sharing one converge on it.
# Restoring and saving a cache is free (the runner's cache bucket is internal); downloading a package is not (it goes
# out through the NAT gateway), so the downloads (Gradle's, Go's modules, Cargo's registry, npm's, uv's) are kept
# across toolchain versions, and only Go's build cache, which a new Go invalidates, is keyed by the toolchain. It is
# keyed by architecture too (CACHE_ARCH), so jobs on amd64 and arm64 runners don't trade compiled output. The others
# hold downloads, which serve either.
.caches:
  gradle:
    key: 'gradle'
    paths: [.cache/gradle/]
  go-mod:
    key: 'go-mod'
    paths: [.cache/go-mod/]
  go-build:
    key: 'go-build-$TOOLCHAIN_VERSION-$CACHE_ARCH'
    paths: [.cache/go-build/]
  cargo:
    key: 'cargo'
    paths: [.cache/cargo/]
  npm:
    key: 'npm'
    paths: [.cache/npm/]
  uv:
    key: 'uv'
    paths: [.cache/uv/]

# A toolchain job that builds nothing: it runs Node scripts with no packages, or a shell script, so it needs the image
# and no cache, and little disk.
.light:
  variables:
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '1Gi'

# Resource tiers (the light tier is the default, in variables above). Memory is each job's peak in a contended
# pipeline (160268), plus the helper's cache unpack, plus about half again. A job whose peak is past its tier sets
# its own KUBERNETES_MEMORY_REQUEST, which merges over the tier's.
.resources-medium:
  variables:
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_MEMORY_REQUEST: '1536Mi'

.resources-heavy:
  variables:
    KUBERNETES_CPU_REQUEST: '2'
    KUBERNETES_MEMORY_REQUEST: '2Gi'

# The heavy tier on the Graviton (arm64) runner, as the app's .cpuheavyjob: the `arm64` tag routes to the runner pinned
# to the gitlab-runner-container-build Karpenter pool (c8g.2xlarge or c8g.4xlarge, 8 or 16 vCPU), whose cores are
# faster than the general pool's. Sized so three fit on a c8g.4xlarge, not to claim a node. Only for a job whose image
# has an arm64 manifest: the toolchain image is amd64 only (kaniko builds it for the runner it runs on), so today that
# is typescript:browser alone.
.resources-heavy-arm64:
  tags: [arm64]
  variables:
    KUBERNETES_CPU_REQUEST: '4'
    KUBERNETES_MEMORY_REQUEST: '3Gi'

.mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- toolchain

toolchain:
  extends: .resources-heavy
  variables:
    KUBERNETES_MEMORY_REQUEST: '4Gi'  # not measured: a rebuild compiles the Go release tools under kaniko
  stage: toolchain
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    # Layers are cached in the project's registry, so a rebuild redoes only the layers whose inputs changed (the Go
    # release tools alone took about ten minutes to compile and snapshot from nothing)
    - >-
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile"
      --destination "$TOOLCHAIN_IMAGE"
      --cache=true --cache-repo="$CI_REGISTRY_IMAGE/toolchain-cache" --snapshot-mode=redo
  # Only when the image's own inputs change. A merge request builds its own tag (the workflow rules, above); main
  # builds TOOLCHAIN_VERSION once it merges.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/Dockerfile
        - scripts/install-smithy-cli.sh

# ---------------------------------------------------------------------------- generate and test

generate:
  extends: [.toolchain, .resources-medium]
  cache:
    - !reference [.caches, gradle]
  stage: generate
  script:
    - scripts/generate.sh
    - |
      # The generated code, and the hand-written files scripts/version.mjs stamps with the version in VERSION.
      if ! git diff --exit-code --stat -- typescript/packages/sdk python/caitlyn go rust/caitlyn-sdk conformance/cases \
          typescript/packages/sdk-core typescript/package-lock.json python/caitlyn-core python/uv.lock rust/Cargo.toml \
          rust/Cargo.lock conformance/rust/Cargo.lock examples/rust/Cargo.lock codegen/smithy-build.json; then
        echo "The committed generated code differs from a fresh generation. Run make generate and commit the result."
        exit 1
      fi
  rules: !reference [.mr-and-main, rules]

typescript:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, npm]
  stage: test
  script:
    - scripts/test-typescript.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/typescript.xml, build/conformance/typescript-browser-build.xml, build/conformance/typescript-runtime.xml, build/package/report.json]
    reports:
      junit: [build/conformance/typescript.xml, build/conformance/typescript-browser-build.xml, build/conformance/typescript-runtime.xml]
  rules: !reference [.mr-and-main, rules]

# The browser build in real browsers. Custom D's Playwright image (custom-d/devops-platform/container-images/playwright,
# Microsoft's image served from our registry) carries the browsers for one Playwright version: keep the version in its
# name (playwright-1.64.1) the same as the playwright version in typescript/package.json.
typescript:browser:
  extends: .resources-heavy-arm64
  stage: test
  image: containers.customd.com/custom-d/devops-platform/container-images/playwright/playwright-1.64.1:latest
  interruptible: true
  needs: []
  variables:
    # It ends at about 160 MB (npm's cache and node_modules); the browsers' profiles under /tmp come and go during the run
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '2Gi'
  cache:
    key: 'playwright-npm'
    paths:
      - .cache/npm/
  script:
    - cd typescript
    - npm ci --no-audit --no-fund --silent
    - npm run -s conformance:browser
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/typescript-browser-*.xml]
    reports:
      junit: build/conformance/typescript-browser-*.xml
  rules: !reference [.mr-and-main, rules]

python:
  extends: [.toolchain, .resources-medium]
  cache:
    - !reference [.caches, uv]
  stage: test
  script:
    - scripts/test-python.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/python.xml]
    reports:
      junit: build/conformance/python.xml
  rules: !reference [.mr-and-main, rules]

go:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  stage: test
  script:
    - scripts/test-go.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/go.json]
  rules: !reference [.mr-and-main, rules]

rust:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, cargo]
  stage: test
  script:
    - scripts/test-rust.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/rust.json]
  rules: !reference [.mr-and-main, rules]

conformance:
  extends: [.toolchain, .light]
  stage: conformance
  needs: [typescript, 'typescript:browser', python, go, rust]
  script:
    - node scripts/check-conformance.mjs
  rules: !reference [.mr-and-main, rules]

# ---------------------------------------------------------------------------- the CLI

cli:vet:
  extends: [.toolchain, .resources-medium]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  stage: test
  script:
    - cd cli
    - |
      test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above are not formatted" >&2; exit 1; }
    - go build ./... && go vet ./... && staticcheck ./...
  rules: !reference [.mr-and-main, rules]

cli:test:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  variables:
    KUBERNETES_MEMORY_REQUEST: '4Gi'  # peak 2.9 GB (go test -race)
  stage: test
  script:
    - cd cli
    - CGO_ENABLED=1 go test -race -count=1 ./...
  rules: !reference [.mr-and-main, rules]

# GoReleaser's whole configuration, in every pipeline, short of what needs a release: no cosign signature (the release
# key signs only on a release tag), no SBOMs, no container image (no Docker daemon here) and nothing published.
# install.ps1's own minisign verifier (C#, for Windows machines without minisign), in PowerShell 7 against real
# minisign signatures (cli/scripts/testdata/minisign). install.sh's verifiers are tested by cli:test.
cli:install-ps1:
  stage: test
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  needs: []
  script:
    - pwsh -NoProfile -File cli/scripts/test-install-ps1.ps1
  rules: !reference [.mr-and-main, rules]

cli:snapshot:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  stage: test
  script:
    - cd cli
    - goreleaser release --snapshot --clean --skip=docker,sign,sbom
  artifacts:
    expire_in: 1 week
    paths: [cli/dist/*.tar.gz, cli/dist/*.zip, cli/dist/*.deb, cli/dist/*.rpm, cli/dist/checksums.txt, cli/dist/homebrew/, cli/dist/scoop/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d/

# ---------------------------------------------------------------------------- the model

# Runs every SDK's developer docs examples against a real workspace (make examples-live, CONTRIBUTING.md). Manual:
# it needs a deployed server. The workspace and agent default to the review environment of the app's v3 server and
# can be overridden per pipeline; the token is the masked variable CAITLYN_TOKEN_MR2062, never echoed (the runner
# masks it in what the examples print). The results table is in the job log.
examples:live:
  extends: [.toolchain, .resources-medium]
  cache:
    # Four at most: Go's build cache is left out, so the examples compile afresh
    - !reference [.caches, go-mod]
    - !reference [.caches, cargo]
    - !reference [.caches, npm]
    - !reference [.caches, uv]
  stage: test
  needs: []
  # One run at a time: every run changes the same agents' drafts and versions.
  resource_group: examples-live
  # Each language waits up to 15 to 21 minutes for a document to index, then deletes what it made; the project's
  # one-hour default would stop the job part way, before the last languages' clean-up.
  timeout: 2h
  variables:
    CAITLYN_WORKSPACE: caitlyn.mr-2062.labs.customd.com
    CAITLYN_AGENT_ID: 988D468D
    # Set for a pipeline when the workspace has them: a knowledge base the document checks may add to, an agent the
    # publish check may publish, and CAITLYN_PUBLIC_ROLE_ONLY=1 while the workspace's role setup has not run.
    CAITLYN_KNOWLEDGE_BASE_ID: ''
    CAITLYN_PUBLISH_AGENT_ID: ''
    CAITLYN_PUBLIC_ROLE_ONLY: ''
  script:
    - CAITLYN_TOKEN="$CAITLYN_TOKEN_MR2062" node scripts/examples-live.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

model:snapshot-only:
  extends: [.toolchain, .light]
  stage: generate
  script:
    - scripts/model-snapshot-check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# A merge request's title is the squash commit's message, and a releasing one (feat, fix, perf, revert, or !) with no
# change file becomes a line of CHANGELOG.md, which build.caitlyn.ai publishes as its Changelog. This runs the docs' public-wording rules
# over it (scripts/docs-mr-title.mjs), so a title that would publish something internal fails while it can still be
# edited. GitLab does not start a pipeline when only the title changes: rerun this job after editing it.
docs:mr-title:
  extends: [.toolchain, .light]
  stage: generate
  script:
    - node scripts/docs-mr-title.mjs "$CI_MERGE_REQUEST_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# A releasing merge request (feat, fix, perf, revert, or !) adds a change file, changes/<name>.md, which becomes its
# entry in the release notes (scripts/release-notes.mjs, .releaserc.yml). This checks the files it adds or edits
# (front matter, a bold lead and a docs link on each highlight, the public-wording rules), that their type and
# `breaking` match the title, and that a model change that breaks callers is marked breaking. The preview's Changelog
# shows the result as its Unreleased entry (docs:build). GitLab starts no pipeline for a title edit: rerun this job.
changes:check:
  extends: [.toolchain, .light]
  stage: generate
  variables:
    # The model and the change files where the merge request branched, to compare with its own
    GIT_DEPTH: '0'
  script:
    - node scripts/release-notes.mjs check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Every timer in a test is deterministic (CONTRIBUTING.md, "Tests and time"): no file's tests may gain a wall-clock
# sleep, timer or clock read over scripts/test-timers-baseline.json, which only goes down
tests:timers:
  extends: [.toolchain, .light]
  stage: generate
  script:
    - node --test scripts/test-timers.test.mjs
    - node scripts/test-timers.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

model:version-check:
  extends: [.toolchain, .light]
  stage: generate
  # Inherits needs from .toolchain, so it waits for a rebuilt toolchain image instead of pulling a tag that
  # doesn't exist yet.
  # Fails when the snapshot says something different from the latest published model: a published model behind it, a
  # hand-pulled unpublished build (no prerelease record), or a model:main pre-release the app has released past with
  # a model it doesn't have. A release that leaves the model as it was passes (scripts/model-check.mjs).
  # In a merge request or a schedule that's exit 2, a warning. On main and v* tags it's --strict, exit 1, and
  # docs:publish needs this job, so the docs never publish from such a snapshot.
  script:
    - scripts/model-check.sh $MODEL_CHECK_FLAGS
  allow_failure:
    exit_codes: [2]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d/
      variables:
        MODEL_CHECK_FLAGS: --strict

# Triggered by the app's main pipeline after a merge that changes smithy/, with APP_COMMIT (CONTRIBUTING.md, "How a
# model change reaches the SDK"). Commits straight to main, and tags a beta, only once every suite passes. One at a
# time, and never cancelled part way through a push.
model:main:
  extends: [.toolchain, .resources-heavy]
  cache:
    # Four at most: Go's build cache and uv's are left out (it compiles afresh, and uv downloads)
    - !reference [.caches, gradle]
    - !reference [.caches, go-mod]
    - !reference [.caches, cargo]
    - !reference [.caches, npm]
  stage: generate
  needs: []
  interruptible: false
  resource_group: model-main
  variables:
    GIT_DEPTH: '0'
  script:
    - scripts/model-main.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $APP_COMMIT
    - if: $CI_PIPELINE_SOURCE == "web" && $APP_COMMIT

# ---------------------------------------------------------------------------- developer docs

docs:build:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, npm]
  stage: docs
  needs: []
  variables:
    KUBERNETES_MEMORY_REQUEST: '3Gi'  # peak 2.0 GB
    # The whole history, so each page's sitemap lastmod is its source's newest commit (scripts/docs-sitemap.mjs); a
    # shallow clone would date every older page at the clone's oldest commit
    GIT_DEPTH: '0'
  script:
    - scripts/docs-build.sh
  artifacts:
    expire_in: 1 week
    paths: [build/docs/]
  rules:
    # Only the default branch's build is the live one (DOCS_LIVE): it alone publishes sitemap.xml and names it in
    # robots.txt, and its pages alone are indexed. A preview publishes no sitemap and every page carries noindex.
    # The live build shows "Was this page useful?" and sends answers to /_feedback (production-demo-infrastructure,
    # developer-docs/feedback.tf). Previews show it, so a reviewer sees the page as it ships, but send nothing: they
    # have no endpoint (their hosting has no /_feedback), and the panel says the answer was not sent.
    # A preview's Changelog opens with an Unreleased entry (DOCS_UNRELEASED): what the next release's notes would say
    # once this merge request merges, its own entries marked (scripts/release-notes.mjs unreleased)
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
        DOCS_UNRELEASED: 'on'
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
        PUBLIC_DOCS_FEEDBACK_ENDPOINT: /_feedback
        DOCS_LIVE: 'on'
    # A release's v* tag builds the live site again: the release commit's CHANGELOG.md has the new release, so the
    # Changelog, its feed and the install instructions show it when it ships, not with the next merge to main (the
    # release commit's own branch pipeline does not run)
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d/
      variables:
        PUBLIC_DOCS_FEEDBACK: 'on'
        PUBLIC_DOCS_FEEDBACK_ENDPOINT: /_feedback
        DOCS_LIVE: 'on'

.docs-aws:
  stage: docs
  image:
    name: amazon/aws-cli:2.27.50
    entrypoint: ['']
  needs: [docs:build]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.customd.com
  before_script:
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN"
      --role-session-name "gitlab-$CI_PIPELINE_ID" --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))

docs:preview:
  extends: .docs-aws
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.preview.build.caitlyn.ai/
    on_stop: docs:preview:stop
    auto_stop_in: 30 days
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"

docs:preview:stop:
  extends: .docs-aws
  needs: []
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
    GIT_STRATEGY: none
  script:
    - aws s3 rm --recursive "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID/"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

docs:publish:
  extends: .docs-aws
  needs: [docs:build, model:version-check]
  variables:
    ROLE_ARN: $DOCS_PUBLISH_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site s3://cd-caitlyn-developer-docs
    - aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths '/*'
  environment:
    name: docs/production
    url: https://build.caitlyn.ai/
  resource_group: docs-production
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d/

# Publishes the built pages into the ask.caitlyn.ai developer-docs knowledge base. A dry run until the publisher
# is built on @caitlyn-ai/sdk (scripts/docs-kb-publish.mjs explains what it waits for).
docs:knowledge-base:
  extends: [.toolchain, .light]
  stage: docs
  needs: [docs:build, docs:publish]
  script:
    - node scripts/docs-kb-publish.mjs --dry-run
  resource_group: docs-knowledge-base
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- the CLI's agent evaluation

# The CLI's agent evaluation (cli/agent-eval/eval.mjs; the CLI design, 20.3). Offline on every merge request that
# touches the CLI, its docs, the mock or the model: the harness's tests, and the scripted agent playing every task's
# reference solution in all three arms against the CLI and the mock, so the tasks and graders can't rot. No model is
# called.
.cli-agent-eval-changes:
  changes:
    - cli/**/*
    - docs/cli/**/*
    - scripts/docs-cli.mjs
    - conformance/mock-server/**/*
    - model/**/*

cli:agent-eval:offline:
  extends: .toolchain
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  stage: test
  needs: []
  script:
    - cli/agent-eval/run.sh --agent scripted --arms docs,snippet,skill
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/agent-eval/]
    reports:
      junit: build/agent-eval/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.cli-agent-eval-changes, changes]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The fast subset against a model: 12 tasks, one run each, the docs-only arm, with the merge request's CLI and built
# docs. Required (allow_failure is false) once CLI_AGENT_EVAL is "true"; until then it does not run. The model API key
# is ANTHROPIC_API_KEY, masked but not protected, because merge-request pipelines run on unprotected branches: anyone
# who can push a branch can read it, so it must be a key kept for this evaluation alone, with a low spending limit,
# and scoped to the agent-eval environment (set the variable's environment scope to agent-eval). The model is
# CLI_AGENT_EVAL_MODEL.
cli:agent-eval:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
    - !reference [.caches, npm]
  stage: docs
  needs:
    - job: docs:build
      optional: true
  variables:
    KUBERNETES_MEMORY_REQUEST: '3Gi'  # builds the docs when docs:build did not run
    CAITLYN_AGENT_EVAL_LIVE: '1'
    CLI_AGENT_EVAL_MODEL: claude-sonnet-5-5
  script:
    - test -d build/docs/site || scripts/docs-build.sh
    - cli/agent-eval/run.sh --agent claude --model "$CLI_AGENT_EVAL_MODEL" --fast --arms docs --docs build/docs/site
  environment:
    name: agent-eval
    action: access
  artifacts:
    when: always
    expire_in: 4 weeks
    paths: [build/agent-eval/]
    reports:
      junit: build/agent-eval/junit.xml
  rules:
    - if: $CLI_AGENT_EVAL != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.cli-agent-eval-changes, changes]

# The whole set nightly on main (a pipeline schedule with CLI_AGENT_EVAL_NIGHTLY set to "true"), and before a release:
# every task, three runs each, all three arms, with each model. A missed threshold fails the job, and the job after it
# opens an issue.
cli:agent-eval:nightly:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
    - !reference [.caches, npm]
  stage: docs
  needs: []
  timeout: 3h
  parallel:
    matrix:
      - CLI_AGENT_EVAL_MODEL: [claude-sonnet-5-5, claude-opus-5-5]
  variables:
    KUBERNETES_MEMORY_REQUEST: '3Gi'  # builds the docs, as docs:build does
    CAITLYN_AGENT_EVAL_LIVE: '1'
  script:
    - scripts/docs-build.sh
    - cli/agent-eval/run.sh --agent claude --model "$CLI_AGENT_EVAL_MODEL" --arms docs,snippet,skill --runs 3 --docs build/docs/site --out "build/agent-eval/$CLI_AGENT_EVAL_MODEL"
  environment:
    name: agent-eval
    action: access
  artifacts:
    when: always
    expire_in: 13 weeks
    paths: [build/agent-eval/]
    reports:
      junit: build/agent-eval/*/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLI_AGENT_EVAL_NIGHTLY == "true"
    - if: $CI_COMMIT_TAG =~ /^v\d/ && $CLI_AGENT_EVAL == "true"

# Opens an issue when the nightly evaluation misses a threshold. Needs CLI_AGENT_EVAL_ISSUE_TOKEN (masked: a project
# access token with the api scope), because a job token can't create issues.
cli:agent-eval:nightly:issue:
  stage: release
  image: curlimages/curl:8.11.1
  needs: ['cli:agent-eval:nightly']
  script:
    - >
      curl --fail --silent --show-error --request POST
      --header "PRIVATE-TOKEN: $CLI_AGENT_EVAL_ISSUE_TOKEN"
      --data-urlencode "title=The CLI's nightly agent evaluation missed a threshold ($(date -u +%Y-%m-%d))"
      --data-urlencode "labels=CLI,Agent evaluation"
      --data-urlencode "description=Pipeline $CI_PIPELINE_URL. The reports (junit.xml and report.json, with every transcript) are the cli:agent-eval:nightly jobs' artefacts. Triage each failed task as a docs gap, a hint gap, a naming problem or a model problem, fix the source the docs are made from, and add a regression task."
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLI_AGENT_EVAL_NIGHTLY == "true" && $CLI_AGENT_EVAL_ISSUE_TOKEN
      when: on_failure

# The Ask Caitlyn evaluation (cli/agent-eval/ask-caitlyn.mjs; 20.4): the CLI question set, put nightly to the
# ask.caitlyn.ai docs agent through the TypeScript SDK, signed in with workload identity (CAITLYN_ID_TOKEN below), so
# no secret is stored. Needs ASK_CAITLYN_AGENT (the docs agent) and a schedule with ASK_CAITLYN_EVAL set to "true".
cli:ask-caitlyn-eval:nightly:
  extends: [.toolchain, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
    - !reference [.caches, npm]
  stage: docs
  needs: []
  id_tokens:
    CAITLYN_ID_TOKEN:
      aud: https://ask.caitlyn.ai/api
  variables:
    CAITLYN_ASK_EVAL_LIVE: '1'
  script:
    - (cd typescript && npm ci --no-audit --no-fund --silent && npm run -s build)
    - (cd cli && go build -o ../build/cli/caitlyn ./cmd/caitlyn)
    - node cli/agent-eval/ask-caitlyn.mjs --bin build/cli/caitlyn --live
  artifacts:
    when: always
    expire_in: 13 weeks
    paths: [build/ask-caitlyn-eval/]
    reports:
      junit: build/ask-caitlyn-eval/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ASK_CAITLYN_EVAL == "true" && $ASK_CAITLYN_AGENT

# ---------------------------------------------------------------------------- releases

# The template's jobs (custom-d/devops-platform/ci-templates/semantic-versioning), with stamp-version between them,
# as the app's update-package-version job is. On main, after conformance passes:
#   fetch-semantic-version  the dry run: VERSION.txt, the version the next release would have (none when no release
#                           is due)
#   stamp-version           writes that version into VERSION and every file that carries it (scripts/version.mjs
#                           release), as artifacts
#   release                 semantic-release: checks the stamp, commits it to main as chore(release): x.y.z, tags
#                           that commit vX.Y.Z and creates the GitLab release (.releaserc.yml)
# The release commit is chore, which never releases, and the workflow rules run no main pipeline for it.
#
# Both run on main only. The template's rules also accept other branch patterns, and they match a tag pipeline too
# ($CI_COMMIT_BRANCH and the unset $CI_TESTING_BRANCH are both empty there), where `conformance` does not exist and
# the pipeline could not be created. These rules replace the template's.
fetch-semantic-version:
  needs: []
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# The artifact paths are every stamped file; scripts/version.mjs assets (in make generate) keeps this list complete.
stamp-version:
  extends: [.toolchain, .resources-medium, .light]
  stage: conformance
  needs:
    - job: fetch-semantic-version
      artifacts: true
  script:
    - |
      if [ ! -s VERSION.txt ]; then
        echo "No release is due: nothing to stamp."
        exit 0
      fi
      node scripts/version.mjs release "$(cat VERSION.txt)"
  artifacts:
    paths:
      - VERSION # stamped
      - typescript/packages/sdk-core/package.json # stamped
      - typescript/packages/sdk-core/src/telemetry.ts # stamped
      - typescript/package-lock.json # stamped
      - python/caitlyn-core/pyproject.toml # stamped
      - python/caitlyn-core/src/caitlyn_core/__init__.py # stamped
      - python/uv.lock # stamped
      - rust/Cargo.toml # stamped
      - rust/Cargo.lock # stamped
      - conformance/rust/Cargo.lock # stamped
      - examples/rust/Cargo.lock # stamped
      - codegen/smithy-build.json # stamped
      - typescript/packages/sdk/package.json # stamped
      - typescript/packages/sdk/src/runtimeConfig.shared.ts # stamped
      - python/caitlyn/pyproject.toml # stamped
      - python/caitlyn/caitlyn/_version.py # stamped
      - go/version.go # stamped
      - rust/caitlyn-sdk/Cargo.toml # stamped
      - rust/caitlyn-sdk/src/lib.rs # stamped
      - cli/internal/spec/commands.json # stamped
  rules:
    - !reference [fetch-semantic-version, rules]

release:
  extends: .resources-medium
  # `needs` replaces the template's stage ordering, under which release ran only after every earlier job had
  # passed, so each one it depends on is named: a failed job in `needs` (none allows failure) skips the release.
  # stamp-version's artifacts are the stamped files the release commit carries. The dry run is required now, so
  # SEMVER_TEST_DISABLED turns the release off too.
  needs:
    - job: conformance
    - job: fetch-semantic-version
    - job: stamp-version
      artifacts: true
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED || $CI_DEPLOY_FREEZE
      when: never
    # A stable release is a person's decision: run it by hand from a main pipeline. Betas are automatic (model:main).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# On the tag the release job made: the tag's tree must already carry its version in every stamped file (the release
# commit). GitHub's release-npm checks the same before it stages anything.
release:version:
  extends: [.toolchain, .light]
  stage: release
  needs: []
  script:
    - node scripts/version.mjs check "${CI_COMMIT_TAG#v}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

# ---------------------------------------------------------------------------- package releases

# Placeholders. npm, PyPI and crates.io releases run on the GitHub mirror, and Go is a tag (below). The Homebrew
# tap can only be claimed by a first publish, which is still to be set up: Sigstore signatures, software bills of
# materials and provenance come with it.
.release-placeholder:
  stage: release
  image: alpine:3.22
  needs: []
  script:
    - echo "$RELEASE_WHAT is not built yet." && exit 1
  rules:
    - if: $RELEASES_ENABLED == "true" && $CI_COMMIT_TAG
      when: manual

# npm releases run on the GitHub mirror, not here: npm trusted publishing (with provenance) accepts OpenID
# Connect tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-npm.yml and
# CONTRIBUTING.md, "Releasing". This placeholder says so if someone runs it.
release:npm:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'npm publishing here (it runs on the GitHub mirror: .github/workflows/release-npm.yml)'

# PyPI releases run on the GitHub mirror, not here: PyPI trusted publishing (with attestations) accepts OpenID
# Connect tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-pypi.yml and
# CONTRIBUTING.md, "Releasing". This placeholder says so if someone runs it.
release:pypi:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'PyPI publishing here (it runs on the GitHub mirror: .github/workflows/release-pypi.yml)'

# Go needs no publishing: the module github.com/caitlyn-ai/sdk/go is go/ in the GitHub mirror, and a release is the
# tag go/vX.Y.Z on the release commit, which semantic-release creates with vX.Y.Z (.releaserc.yml,
# scripts/go-tag.mjs). The Go module proxy fetches the module from GitHub the first time someone asks for it.
# This job tags a release by hand, when its Go tag failed: run a pipeline on main (Build → Pipelines → Run pipeline)
# with the variable GO_TAG set to the release tag, such as v0.9.0, then start this job. A Go tag already on that
# release's commit is left alone. It refuses a release whose go/go.mod declares another module path: every release up
# to v0.8.0 declares github.com/caitlyn-ai/caitlyn-go, so they have no Go release.
release:go:
  extends: [.toolchain, .light]
  stage: release
  needs: []
  script:
    - node scripts/go-tag.mjs "$GO_TAG"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GO_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual

# crates.io releases run on the GitHub mirror, not here: crates.io trusted publishing accepts OpenID Connect
# tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-crates.yml and CONTRIBUTING.md,
# "Releasing". This placeholder says so if someone runs it.
release:crates:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'crates.io publishing here (it runs on the GitHub mirror: .github/workflows/release-crates.yml)'

release:homebrew:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Building the CLI and updating the github.com/caitlyn-ai Homebrew tap'

# ---------------------------------------------------------------------------- the CLI's releases

# Signing with the release key in AWS KMS (alias/caitlyn-cli-release): the job's GitLab id_token is exchanged for the
# role cd-caitlyn-cli-signing (CLI_SIGNING_ROLE_ARN), which only protected v* tags may assume and which may only sign
# with that key. cosign's AWS client reads the token file and role from the environment; no AWS key is stored.
.cli-signing:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.customd.com
  variables:
    AWS_ROLE_ARN: $CLI_SIGNING_ROLE_ARN
    AWS_ROLE_SESSION_NAME: cli-release-$CI_JOB_ID
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab-oidc-token
    AWS_REGION: ap-southeast-2
    CLI_COSIGN_KEY: awskms:///alias/caitlyn-cli-release

# By hand, on a protected release tag, once RELEASES_ENABLED is "true", with the variables listed at the top.
.cli-release-rules:
  rules:
    - if: $RELEASES_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual

# Builds every archive and package with SBOMs, signs checksums.txt (which names them all by SHA-256) with the release
# key in AWS KMS, and lays out the release as build.caitlyn.ai/releases/cli/ serves it, with cosign.pub. It first checks that
# the KMS key is the one the binaries are built with. The minisign key never reaches this job: cli:publish signs the
# manifest.
cli:release:
  extends: [.toolchain, .cli-signing, .resources-heavy]
  cache:
    - !reference [.caches, go-mod]
    - !reference [.caches, go-build]
  stage: release
  needs: []
  script:
    # The minisign key the binaries are built with must be set and well formed, before anything is built or signed
    - cli/scripts/minisign-key-check.sh
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    # The key KMS signs with must be the one the binaries are built with, before anything is built or signed
    - cosign public-key --key "$CLI_COSIGN_KEY" > /tmp/cosign.pub
    - cli/scripts/cosign-key-check.sh /tmp/cosign.pub
    - cd cli
    - goreleaser release --clean --skip=docker
    - scripts/release-manifest.sh dist ../build/cli-release
    # Published at build.caitlyn.ai/releases/cli/cosign.pub by cli:publish
    - cp /tmp/cosign.pub ../build/cli-release/cosign.pub
    - mkdir -p ../build/cli-tools && cp "$(command -v minisign)" "$(command -v cosign)" ../build/cli-tools/
  artifacts:
    expire_in: 1 month
    # The formula and the Scoop manifest are written here but pushed by cli:packages, after cli:publish.
    paths: [build/cli-release/, build/cli-tools/, cli/dist/homebrew/, cli/dist/scoop/]
  rules: !reference [.cli-release-rules, rules]

# Signs the manifest with the minisign key from Secrets Manager and checks the signature against
# CAITLYN_MINISIGN_PUBLIC_KEY, the key every CLI build verifies with, then uploads the release to its own bucket
# (cd-caitlyn-cli-releases: versioned, and this job's role can't delete), then the installers and the key, and moves
# the channel pointer last.
cli:publish:
  stage: release
  image:
    name: amazon/aws-cli:2.27.50
    entrypoint: ['']
  needs: [cli:release]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.customd.com
  variables:
    ROLE_ARN: $CLI_RELEASE_ROLE_ARN
  before_script: !reference [.docs-aws, before_script]
  script:
    - export PATH="$CI_PROJECT_DIR/build/cli-tools:$PATH"
    - cli/scripts/release-publish.sh build/cli-release
  # channel-moved names the channel this release moved, if it moved one: cli:image moves latest only for stable
  artifacts:
    expire_in: 1 month
    paths: [build/cli-release/channel-moved]
  environment:
    name: cli/releases
    url: https://build.caitlyn.ai/releases/cli/
  resource_group: cli-releases
  rules: !reference [.cli-release-rules, rules]

# Pushes the Homebrew formula to github.com/caitlyn-ai/homebrew-tap and the Scoop manifest to
# github.com/caitlyn-ai/scoop-bucket, only after cli:publish has uploaded the archives they point to, so `brew` and
# `scoop` never see a release whose download isn't there yet. HOMEBREW_TAP_TOKEN and SCOOP_BUCKET_TOKEN are masked and
# protected; a missing one skips that package manager.
cli:packages:
  extends: [.toolchain, .light]
  stage: release
  needs:
    - job: cli:release
      artifacts: true
    - job: cli:publish
      artifacts: false
  script:
    - cli/scripts/release-packages.sh cli/dist "$CI_COMMIT_TAG"
  resource_group: cli-releases
  rules:
    - if: $RELEASES_ENABLED == "true" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"

# The container image, ghcr.io/caitlyn-ai/caitlyn, for amd64 and arm64, from cli/Dockerfile: built from the
# release's own linux archives (checked against its manifest), never a second build, and signed with the release key
# in AWS KMS before any tag names it (scripts/release-image.sh). Tags X.Y.Z, and X.Y and latest not for a
# prerelease; latest only when this release moved the stable channel, which cli:publish records. After cli:publish,
# so no tag points at a release that was never published, and one release at a time. It needs the docker-privileged
# runner: a privileged Docker-in-Docker service, with QEMU for the arm64 image's `apk add`.
cli:image:
  extends: .cli-signing
  stage: release
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  tags: [docker-privileged]
  needs:
    - job: cli:release
      artifacts: true
    - job: cli:publish
      artifacts: true
  resource_group: cli-releases
  variables:
    AWS_ROLE_SESSION_NAME: cli-image-$CI_JOB_ID
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: '1'
  before_script:
    - until docker info > /dev/null 2>&1; do sleep 1; done
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install arm64
    - printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
  script:
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - export PATH="$CI_PROJECT_DIR/build/cli-tools:$PATH"
    - cli/scripts/release-image.sh build/cli-release
  after_script:
    - docker logout ghcr.io || true
  rules: !reference [.cli-release-rules, rules]

# Mirrors cli/integrations/gitlab to caitlyn-ai/ci-components and cli/integrations/github/* to
# caitlyn-ai/setup-caitlyn and caitlyn-ai/diff-comment, tagged with the release, once those projects exist.
cli:integrations:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Mirroring the CLI integrations to their own projects'
