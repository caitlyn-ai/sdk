# The Caitlyn SDK repository's pipeline (custom-d/caitlyn/sdk).
#
#   toolchain              Builds docker/Dockerfile into this project's registry when it changes. Every other job
#                          runs in that image, the same one `make` uses locally.
#   generate               Regenerates every SDK from the committed model snapshot and fails if the committed
#                          generated code differs: generated code is reviewed in merge requests, never edited.
#   typescript/python/go/rust  Install, strict type checks, lint, and the conformance harness against the mock server.
#   conformance            Checks that every language ran and passed every protocol and example case.
#   model:version-check    Is the snapshot the latest published model? A warning on merge requests when not.
#   regenerate             An app release that publishes a model triggers this project (multi-project pipeline);
#                          it pulls the model, regenerates, tests, and opens a merge request.
#   docs:*                 Developer docs build, merge request previews, publishing to build.caitlyn.ai and to
#                          the ask.caitlyn.ai knowledge base. Off until DOCS_ENABLED is "true" (docs/README.md).
#   fetch-semantic-version On main: the version the next release would have (VERSION.txt), from the shared
#                          semantic-versioning template.
#   release                On main, after conformance passes: semantic-release (.releaserc.yml) tags vX.Y.Z and
#                          creates the GitLab release when the commits since the last tag call for one. The push
#                          mirror takes the tag to GitHub, which stages the npm packages (CONTRIBUTING.md, "Releasing").
#   release:*              Placeholders for the PyPI, Go, crates.io and Homebrew releases. Off until RELEASES_ENABLED
#                          is "true".
#
# CI variables this file reads (set on the project, never in this file):
#   DOCS_ENABLED, DOCS_PUBLISH_ROLE_ARN (protected), DOCS_PREVIEW_ROLE_ARN, DOCS_DISTRIBUTION_ID (protected),
#   ASK_CAITLYN_CLIENT_ID and ASK_CAITLYN_CLIENT_SECRET (masked, protected), SDK_BOT_TOKEN (masked, protected),
#   GITLAB_TOKEN (masked, protected: a project access token with the Maintainer role, which may create the
#   protected v* tags, and the api and write_repository scopes; semantic-release uses it), RELEASES_ENABLED.

include:
  # fetch-semantic-version and release: semantic-release in the shared image, as the app repository runs it.
  - project: 'custom-d/devops-platform/ci-templates/semantic-versioning'
    file: 'semver.gitlab-ci.yml'

workflow:
  rules:
    # The release commit (chore(release): x.y.z, which the release job pushes to main) runs no branch pipeline: it
    # only stamps the version, and its tag's pipeline (below) checks that. Its message has no [skip ci], because
    # GitHub Actions would then skip the tag's release-npm run (CONTRIBUTING.md, "Releasing").
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): /'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline" # triggered by an app release (regenerate)
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    # A v* tag (made by the release job) runs release:version, and the tag-driven release:* placeholders once
    # RELEASES_ENABLED is "true". Nothing else: npm releases from the tag on the GitHub mirror.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - toolchain
  - generate
  - test
  - conformance
  - docs
  - release

variables:
  # Bump when docker/Dockerfile or scripts/install-smithy-cli.sh changes; the toolchain job pushes this tag.
  TOOLCHAIN_VERSION: '2'
  TOOLCHAIN_IMAGE: '$CI_REGISTRY_IMAGE/toolchain:$TOOLCHAIN_VERSION'
  # The app project's package registry, where each app release publishes caitlyn-v3-model/<version>/.
  MODEL_PROJECT_ID: '653'
  MODEL_PACKAGE: 'caitlyn-v3-model'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.cache/gradle'
  GOMODCACHE: '$CI_PROJECT_DIR/.cache/go-mod'
  GOCACHE: '$CI_PROJECT_DIR/.cache/go-build'
  npm_config_cache: '$CI_PROJECT_DIR/.cache/npm'
  UV_CACHE_DIR: '$CI_PROJECT_DIR/.cache/uv'
  CARGO_HOME: '$CI_PROJECT_DIR/.cache/cargo'

.toolchain:
  image: $TOOLCHAIN_IMAGE
  needs:
    - job: toolchain
      optional: true
  interruptible: true
  cache:
    key: 'toolchain-$TOOLCHAIN_VERSION'
    paths:
      - .cache/

.mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- toolchain

toolchain:
  stage: toolchain
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile" --destination "$TOOLCHAIN_IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/Dockerfile
        - scripts/install-smithy-cli.sh
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------- generate and test

generate:
  extends: .toolchain
  stage: generate
  script:
    - scripts/generate.sh
    - |
      # The generated code, and the hand-written files scripts/version.mjs stamps with the version in VERSION.
      if ! git diff --exit-code --stat -- typescript/packages/sdk python/caitlyn go rust/caitlyn-sdk conformance/cases \
          typescript/packages/sdk-core typescript/package-lock.json python/caitlyn-core python/uv.lock rust/Cargo.toml \
          rust/Cargo.lock conformance/rust/Cargo.lock codegen/smithy-build.json; then
        echo "The committed generated code differs from a fresh generation. Run make generate and commit the result."
        exit 1
      fi
  rules: !reference [.mr-and-main, rules]

typescript:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-typescript.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/typescript.xml, build/conformance/typescript-runtime.xml, build/package/report.json]
    reports:
      junit: [build/conformance/typescript.xml, build/conformance/typescript-runtime.xml]
  rules: !reference [.mr-and-main, rules]

python:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-python.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/python.xml]
    reports:
      junit: build/conformance/python.xml
  rules: !reference [.mr-and-main, rules]

go:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-go.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/go.json]
  rules: !reference [.mr-and-main, rules]

rust:
  extends: .toolchain
  stage: test
  script:
    - scripts/test-rust.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/conformance/rust.json]
  rules: !reference [.mr-and-main, rules]

conformance:
  extends: .toolchain
  stage: conformance
  needs: [typescript, python, go, rust]
  script:
    - node scripts/check-conformance.mjs
  rules: !reference [.mr-and-main, rules]

# ---------------------------------------------------------------------------- the model

model:version-check:
  extends: .toolchain
  stage: generate
  # Inherits needs from .toolchain, so it waits for a rebuilt toolchain image instead of pulling a tag that
  # doesn't exist yet.
  script:
    - scripts/model-check.sh
  # Exit 2 means "behind, unpublished, or nothing published yet": a warning, not a failure.
  allow_failure:
    exit_codes: [2]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Triggered by the app's publish:smithy-model job after a release (CONTRIBUTING.md has the app's trigger job):
#   trigger: { project: custom-d/caitlyn/sdk, branch: main }, optionally with MODEL_VERSION: <release>
# Pulls that model, regenerates, runs every suite, then pushes branch model/<version> and opens a merge
# request. Needs SDK_BOT_TOKEN: a project access token (Developer, write_repository and api) for the push and
# the merge request API.
regenerate:
  extends: .toolchain
  stage: generate
  needs: []
  variables:
    MODEL_VERSION: 'latest'
  script:
    - scripts/model-pull.sh "$MODEL_VERSION"
    - |
      if git diff --quiet -- model; then
        echo "The snapshot is already ${MODEL_VERSION}; nothing to regenerate."
        exit 0
      fi
    - scripts/generate.sh
    - scripts/test-typescript.sh && scripts/test-python.sh && scripts/test-go.sh && scripts/test-rust.sh && node scripts/check-conformance.mjs
    - scripts/open-model-mr.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REGENERATE == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $REGENERATE == "true"

# ---------------------------------------------------------------------------- developer docs

docs:build:
  extends: .toolchain
  stage: docs
  needs: []
  script:
    - scripts/docs-build.sh
  artifacts:
    expire_in: 1 week
    paths: [build/docs/]
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.docs-aws:
  stage: docs
  image:
    name: amazon/aws-cli:2.27.50
    entrypoint: ['']
  needs: [docs:build]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.customd.com
  before_script:
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN"
      --role-session-name "gitlab-$CI_PIPELINE_ID" --web-identity-token "$GITLAB_OIDC_TOKEN"
      --duration-seconds 3600 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))

docs:preview:
  extends: .docs-aws
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.preview.build.caitlyn.ai/
    on_stop: docs:preview:stop
    auto_stop_in: 30 days
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"

docs:preview:stop:
  extends: .docs-aws
  needs: []
  variables:
    ROLE_ARN: $DOCS_PREVIEW_ROLE_ARN
    GIT_STRATEGY: none
  script:
    - aws s3 rm --recursive "s3://cd-caitlyn-developer-docs-previews/mr-$CI_MERGE_REQUEST_IID/"
  environment:
    name: docs/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

docs:publish:
  extends: .docs-aws
  variables:
    ROLE_ARN: $DOCS_PUBLISH_ROLE_ARN
  script:
    - scripts/docs-upload.sh build/docs/site s3://cd-caitlyn-developer-docs
    - aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths '/*'
  environment:
    name: docs/production
    url: https://build.caitlyn.ai/
  resource_group: docs-production
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Publishes the built pages into the ask.caitlyn.ai developer-docs knowledge base. A dry run until lane D4
# builds the publisher on @caitlyn-ai/sdk (scripts/docs-kb-publish.mjs explains what it waits for).
docs:knowledge-base:
  extends: .toolchain
  stage: docs
  needs: [docs:build, docs:publish]
  script:
    - node scripts/docs-kb-publish.mjs --dry-run
  resource_group: docs-knowledge-base
  rules:
    - if: $DOCS_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------- releases

# The template's jobs (custom-d/devops-platform/ci-templates/semantic-versioning), with stamp-version between them,
# as the app's update-package-version job is. On main, after conformance passes:
#   fetch-semantic-version  the dry run: VERSION.txt, the version the next release would have (none when no release
#                           is due)
#   stamp-version           writes that version into VERSION and every file that carries it (scripts/version.mjs
#                           release), as artifacts
#   release                 semantic-release: checks the stamp, commits it to main as chore(release): x.y.z, tags
#                           that commit vX.Y.Z and creates the GitLab release (.releaserc.yml)
# The release commit is chore, which never releases, and the workflow rules run no main pipeline for it.
#
# Both run on main only. The template's rules also accept other branch patterns, and they match a tag pipeline too
# ($CI_COMMIT_BRANCH and the unset $CI_TESTING_BRANCH are both empty there), where `conformance` does not exist and
# the pipeline could not be created. These rules replace the template's.
fetch-semantic-version:
  needs: []
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# The artifact paths are every stamped file; scripts/version.mjs assets (in make generate) keeps this list complete.
stamp-version:
  extends: .toolchain
  stage: conformance
  needs:
    - job: fetch-semantic-version
      artifacts: true
  script:
    - |
      if [ ! -s VERSION.txt ]; then
        echo "No release is due: nothing to stamp."
        exit 0
      fi
      node scripts/version.mjs release "$(cat VERSION.txt)"
  artifacts:
    paths:
      - VERSION # stamped
      - typescript/packages/sdk-core/package.json # stamped
      - typescript/packages/sdk-core/src/telemetry.ts # stamped
      - typescript/package-lock.json # stamped
      - python/caitlyn-core/pyproject.toml # stamped
      - python/caitlyn-core/src/caitlyn_core/__init__.py # stamped
      - python/uv.lock # stamped
      - rust/Cargo.toml # stamped
      - rust/Cargo.lock # stamped
      - conformance/rust/Cargo.lock # stamped
      - codegen/smithy-build.json # stamped
      - typescript/packages/sdk/package.json # stamped
      - typescript/packages/sdk/src/runtimeConfig.shared.ts # stamped
      - python/caitlyn/pyproject.toml # stamped
      - python/caitlyn/caitlyn/_version.py # stamped
      - go/version.go # stamped
      - rust/caitlyn-sdk/Cargo.toml # stamped
      - rust/caitlyn-sdk/src/lib.rs # stamped
  rules:
    - !reference [fetch-semantic-version, rules]

release:
  # `needs` replaces the template's stage ordering, under which release ran only after every earlier job had
  # passed, so each one it depends on is named: a failed job in `needs` (none allows failure) skips the release.
  # stamp-version's artifacts are the stamped files the release commit carries. The dry run is required now, so
  # SEMVER_TEST_DISABLED turns the release off too.
  needs:
    - job: conformance
    - job: fetch-semantic-version
    - job: stamp-version
      artifacts: true
  rules:
    - if: $SEMVER_DISABLED || $SEMVER_TEST_DISABLED || $CI_DEPLOY_FREEZE
      when: never
    - if: $SEMVER_MANUAL_RELEASE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SEMANTIC_RELEASE_PACKAGE: 'Caitlyn SDKs'

# On the tag the release job made: the tag's tree must already carry its version in every stamped file (the release
# commit). GitHub's release-npm checks the same before it stages anything.
release:version:
  extends: .toolchain
  stage: release
  needs: []
  script:
    - node scripts/version.mjs check "${CI_COMMIT_TAG#v}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

# ---------------------------------------------------------------------------- package releases

# Placeholders. Package names on PyPI, the Go module path and the Homebrew tap can only be claimed by a first
# publish, which is lane R2's: trusted publishing (npm, PyPI), Sigstore signatures, software bills of
# materials, provenance and the GitHub mirrors under github.com/caitlyn-ai come with it.
.release-placeholder:
  stage: release
  image: alpine:3.22
  needs: []
  script:
    - echo "$RELEASE_WHAT is not built yet (lane R2 of the v3 implementation plan)." && exit 1
  rules:
    - if: $RELEASES_ENABLED == "true" && $CI_COMMIT_TAG
      when: manual

# npm releases run on the GitHub mirror, not here: npm trusted publishing (with provenance) accepts OpenID
# Connect tokens from GitHub Actions, not from this GitLab. See .github/workflows/release-npm.yml and
# CONTRIBUTING.md, "Releasing". This placeholder says so if someone runs it.
release:npm:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'npm publishing here (it runs on the GitHub mirror: .github/workflows/release-npm.yml)'

release:pypi:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Publishing caitlyn and caitlyn-core to PyPI (the first upload claims the names)'

release:go:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Mirroring go/ to github.com/caitlyn-ai/caitlyn-go and tagging the module'

# The first upload claims the crate names; crates.io trusted publishing (GitHub Actions OIDC) is lane R2's.
release:crates:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Publishing caitlyn-sdk-core, then caitlyn-sdk, to crates.io'

release:homebrew:
  extends: .release-placeholder
  variables:
    RELEASE_WHAT: 'Building the CLI and updating the github.com/caitlyn-ai Homebrew tap'
